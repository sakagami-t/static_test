<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Feed</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js" type="module"></script>
    <script defer src="faceDetection.js" type="module"></script>
</head>
<body>
    <h1>Camera Feed</h1>
    <video id="video" width="640" height="480" autoplay></video>
    <script>
        // Access the user's camera and display the video feed
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(function(stream) {
                var video = document.getElementById('video');
                video.srcObject = stream;
                video.play();

                // Call the face detection function after the video feed starts
                video.addEventListener('play', async () => {
                    await loadModels();
                    setInterval(async () => {
                        const detections = await detectFaces(video);
                        drawDetections(video, detections);
                    }, 100);
                });
            })
            .catch(function(err) {
                console.log("An error occurred: " + err);
            });
    </script>
</body>
</html>
